---
layout: default
---

<article class="article">

    <header class="article-header">

        <h1>{{ page.title }}</h1>

        {% if page.description %}
        <p class="article-description">
            {{ page.description }}
        </p>
        {% endif %}

    </header>

    <div class="article-content">
        {{ content }}
    </div>

</article>

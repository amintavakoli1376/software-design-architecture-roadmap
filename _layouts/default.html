<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ page.title }} | {{ site.title }}</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
            line-height: 2;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background: white;
            padding: 50px;
            border-radius: 12px;
        }

        h1 {
            font-size: 36px;
        }

        h2 {
            margin-top: 40px;
        }

        p {
            font-size: 18px;
        }

        pre {
            direction: ltr;
            text-align: left;
            background: #222;
            color: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div class="container">

    {{ content }}

</div>

</body>

</html>
